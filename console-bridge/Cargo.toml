[package]
name = "console-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
embassy-embedded-hal = "0.5.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.9.0", features = ["critical-section-impl", "rp235xa", "time-driver"] }
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embassy-usb = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
midly = { version = "0.5.3", default-features = false }
panic-halt = "1.0.0"
sequential-storage = { version = "7.1.0", default-features = false }
static_cell = "2.1.1"
