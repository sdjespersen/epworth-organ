[package]
name = "epworth-organ-combo-action-avr"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"
embedded-hal-bus = { version = "0.3.0", features = ["portable-atomic"] }
embedded-hal = "1.0.0"

# not on crates.io so we fetch it via github
[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "ff4909c00ceee76d60f8bd7cc95bc0f3e2ab673f"
features = ["arduino-nano"]

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"

[unstable]
build-std = ["core"]
build-std-features = ["panic_immediate_abort"]
